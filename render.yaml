services:
  - type: web
    name: preroll-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: preroll-postgres
          property: connectionString
      - key: ALLOWED_ORIGIN
        value: https://preroll.org
      - key: NODE_ENV
        value: production

databases:
  - name: preroll-postgres
    databaseName: preroll
    user: preroll

cronJobs:
  - name: preroll-strain-sync
    runtime: node
    rootDir: server
    schedule: "0 4 * * *"
    buildCommand: npm install
    startCommand: npm run sync-strains
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: preroll-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
