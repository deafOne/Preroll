services:
  - type: web
    name: Preroll
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    repo: https://github.com/deafOne/Preroll
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: preroll-production
          property: connectionString
      - key: ALLOWED_ORIGIN
        value: https://preroll.org
      - key: NODE_ENV
        value: production
      - key: STRAIN_SYNC_ON_EMPTY
        value: "true"

  - type: cron
    name: preroll-strain-sync
    runtime: node
    rootDir: server
    schedule: "0 5 * * *"
    repo: https://github.com/deafOne/Preroll
    buildCommand: npm install
    startCommand: npm run sync-strains
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: preroll-production
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: STRAIN_SYNC_ON_EMPTY
        value: "false"

databases:
  # Retain the suspended legacy database declaration so a Blueprint sync does not remove it.
  - name: robb
    databaseName: robb
    user: robb_user
    plan: free
    region: oregon
  - name: preroll-production
    databaseName: preroll_production
    user: preroll_production_user
    plan: basic_256mb
    region: oregon
