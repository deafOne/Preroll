services:
  - type: web
    name: Preroll
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: robb
          property: connectionString
      - key: ALLOWED_ORIGIN
        value: https://preroll.org
      - key: NODE_ENV
        value: production
      - key: STRAIN_SYNC_ON_EMPTY
        value: "true"

  - type: cron
    name: preroll-strain-sync
    runtime: node
    rootDir: server
    schedule: "0 4 * * *"
    buildCommand: npm install
    startCommand: npm run sync-strains
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: robb
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: STRAIN_SYNC_ON_EMPTY
        value: "false"

databases:
  - name: robb
    databaseName: robb
    user: robb_user
    plan: free
    region: oregon
