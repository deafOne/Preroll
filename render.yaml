services:
  - type: web
    name: preroll-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: preroll-postgres
          property: connectionString
      - key: ALLOWED_ORIGIN
        value: https://preroll.org
      - key: NODE_ENV
        value: production
      - key: NEWS_API_KEY
        sync: false
      - key: NEWS_QUERY
        value: cannabis OR marijuana OR hemp OR dispensary OR cannabis regulation
      - key: WEEDMAPS_ACCESS_TOKEN
        sync: false
      - key: WEEDMAPS_MENU_ID
        sync: false

databases:
  - name: preroll-postgres
    databaseName: preroll
    user: preroll
