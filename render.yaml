services:
  - type: web
    name: Preroll
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    repo: https://github.com/deafOne/Preroll
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: robb-v2wf
          property: connectionString
      - key: ALLOWED_ORIGIN
        value: https://preroll.org
      - key: NODE_ENV
        value: production
      - key: STRAIN_SYNC_ON_EMPTY
        value: "true"

  - type: cron
    name: preroll-strain-sync
    runtime: node
    rootDir: server
    schedule: "0 5 * * *"
    repo: https://github.com/deafOne/Preroll
    buildCommand: npm install
    startCommand: npm run sync-strains
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: robb-v2wf
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: STRAIN_SYNC_ON_EMPTY
        value: "false"
