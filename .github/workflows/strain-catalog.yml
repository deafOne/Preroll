name: Build strain catalog snapshot
# The live PostgreSQL catalog is maintained by the Render cron job every two hours.
# This workflow is manual-only to prevent a second independent scheduled scraper.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-writers
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Refresh static fallback snapshot (10-second request spacing)
        run: node scripts/build-strain-catalog.js
      - name: Commit catalog
        run: |
          git config user.name "preroll-strain-bot"
          git config user.email "actions@github.com"
          git add strains/catalog.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged"
          else
            git commit -m "Update strain catalog snapshot"
            git pull --rebase origin main
            git push
          fi
