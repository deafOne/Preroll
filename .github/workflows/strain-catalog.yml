name: Build strain catalog

on:
  push:
    branches: [main]
    paths-ignore:
      - 'strains/catalog.json'
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Scrape Leafly and Weedmaps
        run: node scripts/build-strain-catalog.js
      - name: Commit catalog
        run: |
          git config user.name "preroll-strain-bot"
          git config user.email "actions@github.com"
          git add strains/catalog.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged"
          else
            git commit -m "Update strain catalog"
            git push
          fi
