name: Build guide catalog
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-writers
  cancel-in-progress: false

jobs:
  guides:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Discover and clean verified guide links
        run: node scripts/build-guide-catalog.js
      - name: Validate guide catalog
        run: node scripts/validate-guide-catalog.js
      - name: Commit catalog
        run: |
          git config user.name "preroll-guide-bot"
          git config user.email "actions@github.com"
          git add guides/catalog.json
          if git diff --cached --quiet; then
            echo "Guide catalog unchanged"
          else
            git commit -m "Update verified cannabis guide catalog"
            git pull --rebase origin main
            git push
          fi
