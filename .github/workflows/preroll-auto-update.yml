name: Preroll.org automatic updates and live-data checks

on:
  push:
    branches: [main]
    paths:
      - 'scripts/check-live-data.js'
      - '.github/workflows/preroll-auto-update.yml'
  schedule:
    - cron: '15 5 * * *'
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preroll-automatic-updates
  cancel-in-progress: false

jobs:
  live-data-monitor:
    name: Verify live data and published page sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out site
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Audit local routes, production API, database, news, OCM, strains and community
        run: node scripts/check-live-data.js

  guide-catalog:
    name: Discover and publish verified guide links
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 5 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out site
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Discover new educational resources and clean legacy placeholders
        run: node scripts/build-guide-catalog.js
      - name: Validate guide catalog before publishing
        run: node scripts/validate-guide-catalog.js
      - name: Publish catalog changes
        run: |
          if git diff --quiet -- guides/catalog.json; then
            echo "No catalog cleanup or ten new verified links today; keeping the current catalog."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guides/catalog.json
          git commit -m "Automated verified guide catalog refresh"
          git push origin HEAD:main
