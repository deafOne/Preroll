name: Validate Preroll.org JavaScript

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check server JavaScript
        run: node --check server/server.js
      - name: Check browser JavaScript
        run: node --check app.js
      - name: Check catalog scripts
        run: |
          node --check scripts/build-guide-catalog.js
          node --check scripts/build-strain-catalog.js
      - name: Validate catalog JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('guides/catalog.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('strains/catalog.json', 'utf8'))"
