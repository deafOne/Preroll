name: Validate Preroll.org JavaScript

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check server JavaScript
        run: node --check server/server.js
      - name: Check browser JavaScript
        run: node --check app.js
