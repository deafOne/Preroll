services:
  - type: cron
    name: preroll-strain-sync-v2wf
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    rootDir: server
    schedule: "0 */2 * * *"
    repo: https://github.com/deafOne/Preroll
    buildCommand: npm install
    startCommand: npm run sync-strains
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: robb-v2wf
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: STRAIN_SYNC_ON_EMPTY
        value: "false"
